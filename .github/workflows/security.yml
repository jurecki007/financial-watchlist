name: Security

# Three triggers, three different jobs to do:
#   push/PR   — gate every commit that lands (fast, blocking)
#   schedule  — catch what was safe when written but isn't now (new CVEs,
#               leaked-credential feeds updating). A weekly sweep of the FULL
#               history, not just the new commits.
#   dispatch  — manual re-run
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Least privilege at the top: read-only for everything. The one job that needs
# to write findings re-grants it for itself only, so a compromised action in the
# other three jobs cannot publish to the security tab.
permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags. A tag like @v4 is mutable — the
# action's owner (or anyone who compromises that repo) can repoint it at new
# code, and it runs here with our token. The trailing comment records which
# release each SHA corresponds to, so Dependabot can still bump them.

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — a secret committed and later "removed" is still
          # in the objects and still readable on a public repo.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-guard:
    name: Env var guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No real secrets in tracked files
        run: bash scripts/check-env-exposure.sh

  sast:
    name: OWASP / static analysis
    runs-on: ubuntu-latest
    container:
      # Pinned by digest for the same reason the actions are pinned by SHA:
      # a floating tag is someone else's mutable pointer into our CI.
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b # 1.172.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep (OWASP Top 10 + JS/TS + secrets)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/secrets \
            --error \
            --skip-unknown-extensions

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip if no package.json yet
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
      - name: npm audit
        if: steps.check.outputs.exists == 'true'
        run: npm audit --audit-level=high
